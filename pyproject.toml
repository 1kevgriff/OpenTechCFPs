[project]
name = "opentechcfps"
version = "0.1.0"
description = "Open tech calls for papers, refreshed every 3 hours"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pycountry>=24.6",
    "pyyaml>=6.0",
    "selectolax>=0.4",
]

[project.scripts]
opentechcfps = "opentechcfps.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opentechcfps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
