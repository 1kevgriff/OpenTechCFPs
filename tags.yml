# tag: [keywords]
#
# A CFP gets a tag when any keyword appears in its name or description as a whole
# word or phrase. Lowercase keywords ignore case. A keyword containing an uppercase
# letter must match exactly, which is how short words like "AI" stay accurate.
# Tag names: lowercase letters, digits and hyphens only (they become URLs).

