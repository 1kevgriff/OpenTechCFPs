name: Update CFPs

on:
  schedule:
    # Every 3 hours, off the hour: scheduled runs queue badly at :00.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: Refetch every event (backfill, about 3 hours)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-cfps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev

      - name: Fetch events
        env:
          FETCH_ALL: ${{ inputs.all && '--all' || '' }}
        run: uv run --no-sync opentechcfps update $FETCH_ALL

      # Runs after a failed or timed-out fetch too: whatever was saved is valid on its own,
      # and a 3-hour backfill should not lose its progress.
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update CFP data"
          git pull --rebase
          git push

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: uv run --no-sync opentechcfps build-site --base-url "$BASE_URL"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
